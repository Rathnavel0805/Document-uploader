<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login</title>

  <style>
    :root {
      --primary: #4f46e5;
      --accent: #7c3aed;
      --border: #e5e7eb;
      --bad: #b91c1c;
      --bad-bg: #fee2e2;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, Arial, sans-serif;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .box {
      background: #fff;
      border-radius: 16px;
      padding: 32px 28px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
      text-align: center;
    }
    .lock { font-size: 2.4rem; margin-bottom: 8px; }
    h1 { font-size: 1.4rem; margin-bottom: 6px; color: #1f2937; }
    p.sub { color: #6b7280; font-size: 0.9rem; margin-bottom: 20px; }
    input {
      width: 100%;
      padding: 12px 14px;
      font-size: 1rem;
      border: 2px solid var(--border);
      border-radius: 10px;
      outline: none;
      margin-bottom: 14px;
    }
    input:focus { border-color: var(--primary); }
    button {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      border: 0;
      border-radius: 10px;
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { background: #d1d5db; cursor: not-allowed; }
    .error {
      background: var(--bad-bg);
      color: var(--bad);
      padding: 10px;
      border-radius: 10px;
      font-size: 0.9rem;
      margin-top: 14px;
    }
    a { display: inline-block; margin-top: 18px; color: var(--primary); font-size: 0.9rem; }
  </style>
</head>

<body>
  <div class="box">
    <div class="lock">🔒</div>
    <h1>Admin Access</h1>
    <p class="sub">Enter the pass key to view uploaded files.</p>

    <form id="loginForm">
      <input type="password" id="key" placeholder="Pass key" autocomplete="current-password" autofocus>
      <button type="submit" id="btn">Unlock</button>
    </form>

    <div class="error" id="error" hidden></div>
    <a href="/">&larr; Back to uploader</a>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const keyBox = document.getElementById('key');
    const btn = document.getElementById('btn');
    const error = document.getElementById('error');

    form.addEventListener('submit', async function (e) {
      e.preventDefault();          // stop the page from reloading
      error.hidden = true;
      btn.disabled = true;
      btn.textContent = 'Checking...';

      try {
        const res = await fetch('/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key: keyBox.value })
        });
        const data = await res.json();

        if (data.ok) {
          location.reload();       // now the server shows the dashboard
          return;
        }
        error.textContent = data.error || 'Login failed';
        error.hidden = false;
      } catch (err) {
        error.textContent = 'Could not reach the server. Is it running?';
        error.hidden = false;
      }

      btn.disabled = false;
      btn.textContent = 'Unlock';
      keyBox.value = '';
      keyBox.focus();
    });
  </script>
</body>
</html>
